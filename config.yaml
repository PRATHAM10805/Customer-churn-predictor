model:
  path: "src/models/model.pkl"
  name: "RandomForest_Churn_V1"

data:
  raw_path: "Telco.csv"
  test_size: 0.2
  random_state: 42

training:
  rf:
    n_estimators: [100, 200, 300]
    max_depth: [5, 10, 15, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  lr:
    C: [0.1, 1.0, 10.0]
    solver: ['liblinear', 'lbfgs']
    max_iter: [1000]
  cv: 5

logging:
  level: "INFO"
